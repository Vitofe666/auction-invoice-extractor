name: Jewellery Ficha verification
on:
  pull_request:
  push:
    branches: [main, codex/build-web-app-for-auction-report-generation]
permissions:
  contents: read
jobs:
  ficha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck:ficha
      - run: npm run build
      - run: npm run test:dates
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer fonts-liberation
      - run: python -m pip install pypdf
      - run: npm run test:ficha:layout
      - uses: actions/upload-artifact@v4
        with:
          name: ficha-export-samples
          path: |
            tmp/ficha/*.pdf
            tmp/ficha/*.docx
            tmp/ficha/word-rendered/*.pdf
